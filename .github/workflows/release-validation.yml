name: Release validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  windows-release-preflight:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate clean Windows release candidate at 100% DPI
        shell: pwsh
        run: >-
          ./tools/Test-ReleaseCandidate.ps1
          -OutputRoot "${{ runner.temp }}\acc-release-preflight"
          -ExpectedDpiPercent 100
          -RequireMissingDrivers
          -RunNuGetAudit

      - name: Upload diagnostic report and UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-preflight
          path: ${{ runner.temp }}/acc-release-preflight/verification
          if-no-files-found: warn
